<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한자 문제 카드</title>
<style>
:root{
  --bg:#f2f9ff; --bgimg:linear-gradient(180deg,#fff7e3 0%,#eef8ff 45%,#f3fff1 100%);
  --card:#ffffff; --ink:#22304a; --sub:#5d6b85; --line:#d9e6f3;
  --accent:#ef5b2e; --soft:#fff0e6; --ok:#12a05a; --okbg:#dff7e9; --no:#e5393b; --nobg:#ffe6e6;
  --pad:#fffef8; --guide:#f2dfc2;
  --t1:#fff3cf; --tb1:#ffe08a; --t2:#e2f1ff; --tb2:#a9d3f7; --t3:#e1f8e6; --tb3:#a8e3b6; --t4:#ffe6f0; --tb4:#f6b3cf;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b2133; --bgimg:linear-gradient(180deg,#232a44 0%,#1b2133 60%);
    --card:#262e47; --ink:#f1f4fb; --sub:#b4bdd3; --line:#3a4565;
    --accent:#ff8a65; --soft:#3a2f34; --ok:#6fe0a4; --okbg:#1f3a30; --no:#ff9a96; --nobg:#40262b;
    --pad:#2d3652; --guide:#4a5578;
    --t1:#3a3a2e; --tb1:#6f6535; --t2:#25364f; --tb2:#3f6290; --t3:#25392f; --tb3:#3f7a55; --t4:#3d2a38; --tb4:#80456a;
  }
}
:root[data-theme="dark"]{
  --bg:#1b2133; --bgimg:linear-gradient(180deg,#232a44 0%,#1b2133 60%);
  --card:#262e47; --ink:#f1f4fb; --sub:#b4bdd3; --line:#3a4565;
  --accent:#ff8a65; --soft:#3a2f34; --ok:#6fe0a4; --okbg:#1f3a30; --no:#ff9a96; --nobg:#40262b;
  --pad:#2d3652; --guide:#4a5578;
  --t1:#3a3a2e; --tb1:#6f6535; --t2:#25364f; --tb2:#3f6290; --t3:#25392f; --tb3:#3f7a55; --t4:#3d2a38; --tb4:#80456a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);background-image:var(--bgimg);background-attachment:fixed;color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;line-height:1.55;padding:16px;min-height:100vh}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:22px;margin:4px 0 2px}
.deco{font-size:30px;text-align:center;letter-spacing:4px;margin:2px 0 8px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.snd{font-size:12px;padding:5px 9px;white-space:nowrap;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.lead{color:var(--sub);font-size:14px;margin:0 0 14px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:6px}
.fill{height:100%;background:linear-gradient(90deg,#ffb347,var(--accent));width:0;transition:width .3s}
.pn{font-size:13px;color:var(--sub);margin-bottom:12px;min-height:20px}
.pn .who{font-weight:700;color:var(--ink);margin-right:10px;display:inline-flex;align-items:center;gap:6px;vertical-align:middle}
.topbar .tgrp{display:flex;align-items:center;gap:8px}
body.quiz{padding-top:0;padding-bottom:8px;min-height:0}
body.quiz h1,body.quiz .lead,body.quiz .credit{display:none}
body.quiz .topbar{margin-bottom:6px;padding-top:6px;padding-bottom:6px}
body.quiz .pn{margin-bottom:6px;min-height:0}
body.quiz .card{padding:10px 12px;margin-bottom:8px}
body.quiz .big{width:clamp(130px,calc(100dvh - 420px),min(78vw,340px));height:clamp(130px,calc(100dvh - 420px),min(78vw,340px));margin:4px auto 8px}
body.quiz .opt{min-height:clamp(56px,9dvh,84px);font-size:clamp(20px,3.2dvh,28px)}
body.quiz .opts{gap:10px}
body.quiz .pics{font-size:32px;gap:8px;line-height:1.1}
body.quiz .prompt{font-size:min(9vw,40px);margin:0 0 6px}
body.quiz .q{margin:0 0 4px;font-size:14px}
body.quiz .pw{width:min(100%,400px,calc(100dvh - 400px));min-width:180px}
body.quiz .padwrap{margin:0}
body.quiz .row{margin:6px 0}
body.quiz .hint{margin:4px 0;font-size:13px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg);margin:-16px -16px 10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.topbar .th{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:7px 14px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
.topbar .tu{display:inline-flex;align-items:center;gap:8px;min-width:0;font-size:14px;font-weight:700;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 4px;cursor:pointer;max-width:55%}
.topbar .tu span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:50%;overflow:hidden;color:#fff;font-weight:800;line-height:1;box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--line)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.sumbox{border:1px solid var(--line);border-radius:14px;padding:12px;margin:6px 0 10px;background:var(--bg)}
.sumhead{display:flex;align-items:center;gap:12px}
.pct{font-size:38px;font-weight:800;line-height:1}.pct small{font-size:18px}
.sumtx{font-size:13px;color:var(--sub);line-height:1.5}.sumtx b{color:var(--ink);font-size:14px}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:10px 0}.meter span{display:block;height:100%;border-radius:4px}
.sumt{font-size:13px;font-weight:700;margin:6px 0}
.hard{display:flex;flex-direction:column;gap:6px}
.hi{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.hi .rk{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.hi .hg{width:38px;height:38px;flex:none}
.hi .ht{display:flex;flex-direction:column;min-width:0}.hi .ht small{color:var(--sub);font-size:12px}
.uhead{display:flex;align-items:center;gap:14px;margin:2px 0 10px}
.uhead .col{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.uhead .nm{font-size:18px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uhead .acts{display:flex;gap:6px;flex-wrap:wrap}
.uhead .btn.sm{padding:5px 12px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(60,100,160,.08)}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--soft);border-radius:999px;padding:2px 10px;margin-bottom:8px}
.q{font-size:15px;color:var(--sub);margin:0 0 6px}
.gl{display:block;color:var(--ink)}
.big{width:min(46vw,210px);height:min(46vw,210px);margin:6px auto 10px}
.prompt{font-size:min(14vw,56px);font-weight:700;text-align:center;margin:2px 0 10px}
.pics{display:flex;justify-content:center;gap:12px;font-size:46px;line-height:1.15;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.tag.rv{background:#fff0c2;color:#9a5b00;margin-left:6px}
.pic{font-size:56px;line-height:1.1;text-align:center;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
:root:not([data-theme="light"]) .btn.main{color:#15171c}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.opt{font-size:20px;font-weight:700;padding:12px 8px;min-height:56px}
.opt:disabled{cursor:default;opacity:1}
.opt:nth-child(1){background:var(--t1);border-color:var(--tb1)}
.opt:nth-child(2){background:var(--t2);border-color:var(--tb2)}
.opt:nth-child(3){background:var(--t3);border-color:var(--tb3)}
.opt:nth-child(4){background:var(--t4);border-color:var(--tb4)}
.opt.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.wrongsel{background:var(--nobg);border-color:var(--no);color:var(--no)}
.cnt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.cnt .btn{font-size:22px;font-weight:800;padding:18px 8px}
.cnt .btn small{display:block;font-size:12px;font-weight:400;color:var(--sub)}
.cnt .btn:nth-child(1){background:var(--t1);border-color:var(--tb1)}
.cnt .btn:nth-child(2){background:var(--t2);border-color:var(--tb2)}
.cnt .btn:nth-child(3){background:var(--t3);border-color:var(--tb3)}
.cnt .btn:nth-child(4){background:var(--t4);border-color:var(--tb4)}
.padwrap{display:flex;justify-content:center}
.pw{position:relative;width:min(100%,400px)}
.pw canvas{width:100%}
.ghost{position:absolute;inset:15%;pointer-events:none;opacity:.17;color:var(--ink);display:none}
.ghost.trace{opacity:.38}
.ghost svg{width:100%;height:100%;display:block}
.hrow{display:flex;align-items:center;justify-content:center;gap:6px;margin:8px 0;flex-wrap:wrap}
.hrow span{font-size:14px;font-weight:700}
.hrow .hb{padding:6px 12px;min-height:0;font-size:13px;background:var(--t1);border-color:var(--tb1)}
.hrow .hb.on{outline:2px solid var(--accent)}
.txt{width:100%;font:inherit;font-size:14px;padding:8px 10px;margin:2px 0 8px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
[hidden]{display:none!important}
.urow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.urow .txt{width:auto;flex:1;min-width:120px;margin:0}
.ulist{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.rlist{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.rrow{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.rrow.lv4{background:var(--t3);border-color:var(--tb3)} .rrow.lv3{background:var(--t2);border-color:var(--tb2)}
.rrow.lv2{background:var(--t4);border-color:var(--tb4)} .rrow.lv1{background:var(--t1);border-color:var(--tb1)}
.rg{flex:0 0 52px;width:52px} .rg svg{width:52px;height:52px;display:block}
.rm{min-width:0;display:flex;flex-direction:column;gap:4px}
.badge{font-size:13px;color:var(--sub)}
.rs{display:flex;gap:6px;flex-wrap:wrap}
.rchip{font-size:13px;padding:2px 8px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.rchip small{color:var(--sub)}
.cmp{display:flex;gap:12px;justify-content:center;margin:10px 0}
.cmp>div{flex:1;max-width:170px;text-align:center;font-size:13px;color:var(--sub);display:flex;flex-direction:column;gap:4px}
.cmp svg{width:100%;height:auto;display:block;background:var(--pad);border:1px solid var(--line);border-radius:12px}
.btn.danger{background:var(--no);border-color:var(--no);color:#fff}
.hintbox{background:var(--t1);border:1px solid var(--tb1);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:14px}
canvas{width:min(100%,320px);aspect-ratio:1;background:var(--pad);border:2px solid var(--line);border-radius:12px;touch-action:none;cursor:crosshair;display:block}
.hint{font-size:13px;color:var(--sub);margin:6px 0 0;text-align:center}
.hint:empty{display:none}
.fb{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px}
.mark{display:flex;justify-content:center;margin:0 0 4px}
.mark svg{width:130px;height:130px}
.mark .ln{stroke-dasharray:260;stroke-dashoffset:260;animation:draw .55s ease forwards}
.mark .ln.d2{animation-delay:.3s}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.mark .ln{animation:none;stroke-dashoffset:0}}
.verdict{font-size:16px;font-weight:700;text-align:center;border-radius:10px;padding:10px 12px;margin:0 0 10px}
.verdict.good{background:var(--okbg);color:var(--ok)}
.verdict.bad{background:var(--nobg);color:var(--no)}
.meanbox{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0}
.mean{font-size:28px;font-weight:800;margin:0}
.info{font-size:14px;margin:6px 0}
.info b{color:var(--accent)}
.info span.w{font-size:18px;margin-right:4px;font-family:"Noto Serif KR","Noto Serif CJK KR","Batang","Apple Myungjo","Songti SC",serif}
.stk{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:6px 0}
.stk .gl{width:110px;height:110px}
.stk svg.sg{width:140px;height:140px;background:var(--pad);border:1px solid var(--line);border-radius:10px}
.fix{font-size:13px;color:var(--sub);text-decoration:underline;background:none;border:0;cursor:pointer;padding:8px;font-family:inherit}
.score{text-align:center;margin:4px 0 4px}
.score .n{font-size:64px;font-weight:800;color:var(--accent);line-height:1.1}
.score .n small{font-size:28px;color:var(--sub);font-weight:700}
.score .msg{font-size:18px;font-weight:700;margin:4px 0 10px}
.split{display:flex;gap:8px;margin:10px 0}
.split div{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:14px}
.split b{display:block;font-size:20px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
th,td{border:1px solid var(--line);padding:6px;text-align:center}
th{background:var(--soft)}
td .gl{width:30px;height:30px;margin:0 auto}
.mk-ok{color:var(--ok);font-weight:800;font-size:20px}.mk-no{color:var(--no);font-weight:800;font-size:20px}
details{margin-top:10px}
summary{cursor:pointer;font-weight:700;font-size:14px;padding:6px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.gi{border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;font-size:12px;line-height:1.3}
.gi .e{font-size:22px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.gi .gl{width:44px;height:44px;margin:2px auto}
.credit{font-size:11px;color:var(--sub);text-align:center;margin:8px 0 24px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar" id="topbar"></div>
  <h1>📚 한자 문제 카드</h1><button class="snd" id="snd"></button>
  <p class="lead" id="lead"></p>
  <div class="bar" id="barwrap" style="display:none"><div class="fill" id="fill"></div></div>
  <div class="pn" id="pn"></div>
  <div id="view"></div>
  <p class="credit">글자 모양: Noto Sans CJK KR (SIL Open Font License). 그림은 뜻을 떠올리기 위한 힌트입니다.</p>
</div>

<script>
// 한자를 추가하려면 META에 항목을 더하고 GLYPH에 글자 모양·채점 데이터를 넣어야 합니다.

function newQuiz(n){
  TOTAL=n;
  var pool=[]; D.forEach(function(h){ pool.push({h:h,t:'A'}); pool.push({h:h,t:'B'}); });
  var left=shuffle(pool.slice()), seq=[];
  while(seq.length<n && left.length){
    var recent=seq.slice(-3).map(function(q){return q.h.ch;});
    var cands=left.filter(function(q){ return recent.indexOf(q.h.ch)<0; });
    if(!cands.length) cands=left.slice();
    var tot=0; cands.forEach(function(q){ tot+=weightOf(q); });
    var r=Math.random()*tot, pick=cands[cands.length-1];
    for(var i=0;i<cands.length;i++){ r-=weightOf(cands[i]); if(r<=0){ pick=cands[i]; break; } }
    left.splice(left.indexOf(pick),1); seq.push(pick);
  }

function setupPad(){

  function bg(){
    g.clearRect(0,0,c.width,c.height);
    var gc=getComputedStyle(document.documentElement).getPropertyValue('--guide').trim()||'#ddd';
    g.save(); g.strokeStyle=gc; g.lineWidth=2; g.setLineDash([8,8]);

    g.beginPath(); g.moveTo(c.width/2,m); g.lineTo(c.width/2,c.height-m);
    g.moveTo(m,c.height/2); g.lineTo(c.width-m,c.height/2); g.stroke(); g.restore();
  }
  function pos(e){ var r=c.getBoundingClientRect(); var s=c.width/r.width; return [(e.clientX-r.left)*s,(e.clientY-r.top)*s]; }
  c.addEventListener('pointerdown',function(e){ down=true; last=pos(e); cur=[last]; strokes.push(cur); try{c.setPointerCapture(e.pointerId);}catch(x){} e.preventDefault(); });
  c.addEventListener('pointermove',function(e){
    if(!down) return; var p=pos(e);
    g.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#000';
    g.lineWidth=10; g.lineCap='round'; g.lineJoin='round';
    g.beginPath(); g.moveTo(last[0],last[1]); g.lineTo(p[0],p[1]); g.stroke(); last=p; cur.push(p); e.preventDefault();
  });
  function up(){ if(down&&cur&&cur.length===1){ g.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#000'; g.beginPath(); g.arc(cur[0][0],cur[0][1],5,0,6.283); g.fill(); } down=false; }
  c.addEventListener('pointerup',up); c.addEventListener('pointercancel',up);
  document.getElementById('clr').onclick=function(){ strokes.length=0; bg(); document.getElementById('hintB').textContent=''; };

}

/* ---------- 채점 1: 획 기준선이 있는 한자(一·二·三) ---------- */
function plen(s){ var L=0; for(var i=1;i<s.length;i++) L+=Math.hypot(s[i][0]-s[i-1][0],s[i][1]-s[i-1][1]); return L; }
function resample(s,n){
  var L=plen(s), out=[];
  if(L===0){ for(var k=0;k<n;k++) out.push(s[0]); return out; }
  var step=L/(n-1), prev=s[0], need=step;
  out.push(prev);
  for(var i=1;i<s.length;i++){
    var cur=s[i], seg=Math.hypot(cur[0]-prev[0],cur[1]-prev[1]);
    while(seg>0 && need<=seg){
      var r=need/seg; prev=[prev[0]+(cur[0]-prev[0])*r, prev[1]+(cur[1]-prev[1])*r];
      out.push(prev); seg=Math.hypot(cur[0]-prev[0],cur[1]-prev[1]); need=step;
    }
    need-=seg; prev=cur;
  }
  while(out.length<n) out.push(s[s.length-1]);
  return out.slice(0,n);
}
function norm(list){
  var xs=[],ys=[];
  list.forEach(function(s){ s.forEach(function(p){ xs.push(p[0]); ys.push(p[1]); }); });
  var x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs), y0=Math.min.apply(null,ys), y1=Math.max.apply(null,ys);
  var sc=Math.max(x1-x0,y1-y0), cx=(x0+x1)/2, cy=(y0+y1)/2;
  return {sc:sc, list:list.map(function(s){ return s.map(function(p){ return [(p[0]-cx)/sc,(p[1]-cy)/sc]; }); })};
}
function judgePaths(h,raw){
  var S2=raw.filter(function(s){ return plen(s)>=20; });
  if(S2.length===0) return {empty:true};
  if(S2.length!==h.paths.length) return {ok:false,msg:'획수가 달라요. '+h.strokes+'획인데 '+S2.length+'획을 썼어요.'};
  var d=norm(S2), r=norm(h.paths);
  if(d.sc<40) return {ok:false,msg:'너무 작게 썼어요. 칸을 넓게 써 보세요.'};
  var worst=0;
  for(var i=0;i<S2.length;i++){
    var a=resample(d.list[i],24), b=resample(r.list[i],24), sum=0;
    for(var k=0;k<24;k++) sum+=Math.hypot(a[k][0]-b[k][0],a[k][1]-b[k][1]);
    worst=Math.max(worst,sum/24);
  }
  if(worst<=0.22) return {ok:true,msg:'잘 썼어요! 획수, 순서, 방향이 맞아요.'};
  return {ok:false,msg:'획 수는 맞지만 모양이나 순서·방향이 달라요. 아래 획순 그림의 번호 순서대로, 왼쪽에서 오른쪽, 위에서 아래로 써 보세요.'};
}

/* ---------- 채점 2: 모양 비교(나머지 한자) ---------- */
// 글자 중심선(기준)과 손글씨의 점들이 위치·방향 모두 얼마나 겹치는지 비교합니다.
var R_O=3.5, LAM=6, CAP=12, RS=10, TH_SUM=8.0, TH_SUM_ONEOFF=5.5, TH_FREE=6.5, RIVAL_RATIO=0.71, TPL={};
function tplFor(ch){
  if(TPL[ch]) return TPL[ch];
  var a=GLYPH[ch].sk, n=a.length/2, X=new Float64Array(n), Y=new Float64Array(n);
  for(var i=0;i<n;i++){ X[i]=a[2*i]/10; Y[i]=a[2*i+1]/10; }
  var x0=Math.min.apply(null,X), x1=Math.max.apply(null,X), y0=Math.min.apply(null,Y), y1=Math.max.apply(null,Y);
  var t={X:X,Y:Y,n:n,cx:(x0+x1)/2,cy:(y0+y1)/2,w:x1-x0,h:y1-y0};
  orient(t); t.dots=findDots(t); TPL[ch]=t; return t;
}
// 점 획(丶)은 손으로 쓰면 위치가 많이 달라지므로, 글자 본체와 떨어진 작은 덩어리를 '점'으로 찾아 둡니다.
function findDots(t){
  var n=t.n, p=new Int32Array(n); for(var i=0;i<n;i++) p[i]=i;
  function f(a){ while(p[a]!==a){ p[a]=p[p[a]]; a=p[a]; } return a; }
  for(var a=0;a<n;a++) for(var b=a+1;b<n;b++){ var dx=t.X[a]-t.X[b], dy=t.Y[a]-t.Y[b]; if(dx*dx+dy*dy<=9){ var ra=f(a), rb=f(b); if(ra!==rb) p[ra]=rb; } }
  var comp={}; for(var k=0;k<n;k++){ var r=f(k); (comp[r]=comp[r]||[]).push(k); }
  var sz=Math.max(t.w,t.h), out=[];
  Object.keys(comp).forEach(function(r){
    var c=comp[r], x0=1e9,x1=-1e9,y0=1e9,y1=-1e9,sx=0,sy=0;
    c.forEach(function(i){ x0=Math.min(x0,t.X[i]); x1=Math.max(x1,t.X[i]); y0=Math.min(y0,t.Y[i]); y1=Math.max(y1,t.Y[i]); sx+=t.X[i]; sy+=t.Y[i]; });
    if(Math.max(x1-x0,y1-y0)<0.5*sz && c.length<n/2.5) out.push({x:sx/c.length,y:sy/c.length,pts:c});
  });
  return out;
}
function orient(P){
  var n=P.n, th=new Float64Array(n), lin=new Float64Array(n), r2=R_O*R_O;
  for(var i=0;i<n;i++){
    var c=0,sx=0,sy=0;
    for(var j=0;j<n;j++){ var dx=P.X[j]-P.X[i], dy=P.Y[j]-P.Y[i]; if(dx*dx+dy*dy<=r2){ c++; sx+=P.X[j]; sy+=P.Y[j]; } }
    if(c<3) continue;
    var mx=sx/c, my=sy/c, cxx=0,cxy=0,cyy=0;
    for(var j2=0;j2<n;j2++){ var ex=P.X[j2]-P.X[i], ey=P.Y[j2]-P.Y[i]; if(ex*ex+ey*ey<=r2){ var ux=P.X[j2]-mx, uy=P.Y[j2]-my; cxx+=ux*ux; cxy+=ux*uy; cyy+=uy*uy; } }
    cxx/=c; cxy/=c; cyy/=c;
    var tr=cxx+cyy, df=Math.sqrt((cxx-cyy)*(cxx-cyy)/4+cxy*cxy), l1=tr/2+df, l2=tr/2-df;
    th[i]=((0.5*Math.atan2(2*cxy,cxx-cyy))%Math.PI+Math.PI)%Math.PI;
    lin[i]=1-l2/(l1+1e-9);
  }
  P.th=th; P.lin=lin;
}
function adiff(a,b){ var d=Math.abs(a-b)%Math.PI; return Math.min(d,Math.PI-d); }
function oneway(A,B){
  var s=0, rs2=RS*RS;
  for(var i=0;i<A.n;i++){
    var best=CAP;
    for(var j=0;j<B.n;j++){
      var dx=B.X[j]-A.X[i], dy=B.Y[j]-A.Y[i], d2=dx*dx+dy*dy;
      if(d2>rs2) continue;
      var c=Math.sqrt(d2)+LAM*adiff(A.th[i],B.th[j])*Math.min(A.lin[i],B.lin[j]);
      if(c<best) best=c;
    }
    s+=best;
  }
  return s/A.n;
}
function densify(strokes,step){
  var X=[],Y=[],S=[],si=-1;
  strokes.forEach(function(s){
    if(!s.length) return; si++;
    X.push(s[0][0]); Y.push(s[0][1]); S.push(si);
    for(var i=1;i<s.length;i++){
      var dx=s[i][0]-s[i-1][0], dy=s[i][1]-s[i-1][1], L=Math.hypot(dx,dy), k=Math.floor(L/step);
      for(var m=1;m<=k;m++){ X.push(s[i-1][0]+dx*m/(k+1)); Y.push(s[i-1][1]+dy*m/(k+1)); S.push(si); }
      X.push(s[i][0]); Y.push(s[i][1]); S.push(si);
    }
  });
  return {X:Float64Array.from(X),Y:Float64Array.from(Y),S:Int16Array.from(S),ns:si+1,n:X.length};
}
// 사용자가 쓴 작은 획(점)을 가장 가까운 글자의 점 자리로 옮겨 비교합니다. (점을 어디에 찍었는지는 크게 따지지 않음)
function snapDots(Q,pts,t){
  var ns=pts.ns, sz=Math.max(t.w,t.h);
  if(!pts.si){ var L=[]; for(var s=0;s<ns;s++) L.push([]); for(var i=0;i<pts.n;i++) L[pts.S[i]].push(i); pts.si=L; }
  var ds=[];
  for(var s2=0;s2<ns;s2++){
    var idx=pts.si[s2], x0=1e9,x1=-1e9,y0=1e9,y1=-1e9,sx=0,sy=0;
    idx.forEach(function(i){ x0=Math.min(x0,Q.X[i]); x1=Math.max(x1,Q.X[i]); y0=Math.min(y0,Q.Y[i]); y1=Math.max(y1,Q.Y[i]); sx+=Q.X[i]; sy+=Q.Y[i]; });
    if(Math.max(x1-x0,y1-y0)<0.3*sz) ds.push({idx:idx,x:sx/idx.length,y:sy/idx.length});
  }
  if(!ds.length) return Q;
  var used={}, pairs=[];

function shapeScore(h,pts,tf){
  var t=tplFor(h.ch), n=pts.n, x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for(var i=0;i<n;i++){ x0=Math.min(x0,pts.X[i]); x1=Math.max(x1,pts.X[i]); y0=Math.min(y0,pts.Y[i]); y1=Math.max(y1,pts.Y[i]); }
  var dw=x1-x0, dh=y1-y0, cx=(x0+x1)/2, cy=(y0+y1)/2;
  var nonuni=Math.min(t.w,t.h)>=0.35*Math.max(t.w,t.h) && Math.min(dw,dh)>=0.2*Math.max(dw,dh);
  var Q={X:new Float64Array(n),Y:new Float64Array(n),n:n};
  if(nonuni){ for(var k=0;k<n;k++){ Q.X[k]=(pts.X[k]-cx)/dw*t.w+t.cx; Q.Y[k]=(pts.Y[k]-cy)/dh*t.h+t.cy; } }
  else{ var s=Math.max(dw,dh), ts=Math.max(t.w,t.h); for(var k2=0;k2<n;k2++){ Q.X[k2]=(pts.X[k2]-cx)/s*ts+t.cx; Q.Y[k2]=(pts.Y[k2]-cy)/s*ts+t.cy; } }
  if(tf){
    var cs=Math.cos(tf.rot), sn=Math.sin(tf.rot), sz=Math.max(t.w,t.h);

      x+=tf.sh*y; x*=tf.sx; y*=tf.sy;

    }
  }

  if(tf&&tf.off&&pts.S){ var sz2=Math.max(t.w,t.h), o=tf.off; for(var q=0;q<n;q++){ var si2=pts.S[q]*2; Q.X[q]+=o[si2]*sz2; Q.Y[q]+=o[si2+1]*sz2; } }

// 전체 위치·크기·기울기·비틀림이 조금 달라도 글자 모양이 맞으면 통과하도록, 작은 범위에서 가장 잘 맞는 배치를 찾습니다.
var FREE={tx:[-.12,.12,.05],ty:[-.12,.12,.05],sx:[.75,1.3,.1],sy:[.75,1.3,.1],rot:[-.25,.25,.07],sh:[-.3,.3,.1]};
function bestShape(h,pts){
  var tf={tx:0,ty:0,sx:1,sy:1,rot:0,sh:0}, best=shapeScore(h,pts,tf), st={}, keys=Object.keys(FREE);

      [-1,1].forEach(function(d){

        var old=tf[k]; tf[k]=v; var s=shapeScore(h,pts,tf);
        if(s<best-1e-6){ best=s; improved=true; } else tf[k]=old;

    });

}
function nameOf(k){ var d=D.find(function(x){return x.ch===k;}); return d?(d.hun+' '+d.eum):GLYPH[k].name; }

function judgeShape(h,raw){
  var strokes=raw.filter(function(s){ return s.length>0; });
  if(!strokes.length) return {empty:true};
  var pts=densify(strokes,5), x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for(var i=0;i<pts.n;i++){ x0=Math.min(x0,pts.X[i]); x1=Math.max(x1,pts.X[i]); y0=Math.min(y0,pts.Y[i]); y1=Math.max(y1,pts.Y[i]); }
  var dim=Math.max(x1-x0,y1-y0);
  if(dim<14) return {ok:false,msg:'너무 작게 썼어요. 조금만 더 크게 써 보세요.'};
  if(dim<325) pts=densify(strokes,Math.max(0.8,dim/65));   // 글자가 작아도 점 간격을 글자 크기에 맞춰 같은 정밀도로 비교
  var sum=bestShape(h,pts);
  if(sum>TH_FREE) return {ok:false,msg:'모양이 달라요. 글자의 모양이 맞게 다시 써 보세요.',sum:sum};
  // 비슷한 다른 글자가 훨씬 더 닮았다면 틀린 것으로 봅니다. (가까운 후보 6개만 정밀 비교)

  return {ok:true,msg:'잘 썼어요! 모양이 맞아요.',sum:sum};

    '<div class="row"><button class="btn main" id="home">🏠 첫 페이지로 돌아가기</button><button class="btn" id="again">같은 개수로 다시 풀기</button><button class="btn" id="repBtn2">📊 한자별 평가</button></div></div>';
  document.getElementById('repBtn2').onclick=function(){ renderReport('weak'); };
  document.getElementById('again').onclick=function(){ newQuiz(TOTAL); render(); };
  document.getElementById('home').onclick=renderStart;
}

function render(){
  advTok++; paintProgress(); window.scrollTo(0,0);
  if(idx>=TOTAL){ if(USERMODE&&CUR&&!R.hd){ R.hd=true; addHist(TOTAL,R.filter(function(r){return r.ok;}).length); } renderResult(); return; }
  var q=Q[idx];
  if(!q){ renderStart(); return; }
  if(q.t==='A') renderA(q); else renderB(q);
}
window.__hz={D:D,GLYPH:GLYPH,judgeShape:judgeShape,judgePaths:judgePaths,shapeScore:shapeScore,densify:densify,tplFor:tplFor,newQuiz:newQuiz,bestShape:bestShape,resetUserData:resetUserData,resetEverything:resetEverything,renderReport:renderReport,tally:tally,TALLY:function(){return TALLY;},registerUser:registerUser,setUser:setUser,users:function(){return USERS;},cur:function(){return CUR;},hist:function(){return HIST;},STATS:function(){return STATS;},setStats:function(s){STATS=s;},playSound:playSound,getQ:function(){return Q;}};
document.getElementById('snd').onclick=toggleSound; paintSnd();
renderStart();
initSync();
</script>
